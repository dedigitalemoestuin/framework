[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Frans de Boer", email = "github.wife581@passmail.net" }
]
requires-python = ">=3.15,<3.16"
dependencies = [
    "django==6.1.3",
    # django plugins
    "django-allauth[mfa]==65.22.1",
    "django-environ==0.14.0",
    "django-stubs-ext==6.1.2",
    "djangorestframework==3.18.3",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "django-stubs[compatible-mypy]==6.1.2",
    "djangorestframework-stubs[compatible-mypy]==3.18.1",
    "factory-boy==3.3.3",
    "faker==40.43.0",
    "mypy==2.3.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-django[django]==4.14.0",
    "ruff==0.17.6",
]

security = [
    "pip-audit==2.10.1",
]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true
extend-select = [
    "ALL"
]

ignore = [
    "missing-trailing-comma",
    "missing-copyright-notice",
    "undocumented-public-module",
    "undocumented-public-class",
    "undocumented-public-method",
    "undocumented-public-function",
    "undocumented-public-package",
    "undocumented-magic-method",
    "undocumented-public-nested-class",
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "docstring-missing-exception",
]

[tool.ruff.lint.extend-per-file-ignores]
"test_*.py" = [
    "assert",
    "hardcoded-password-func-arg",
]

"core/settings/__init__.py" = [
    "undefined-local-with-import-star"
]

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

strict = true
untyped_calls_exclude = ["factory"]

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["allauth.*"]
follow_untyped_imports = true

[tool.django-stubs]
django_settings_module = "core.settings"
strict_settings = true
strict_model_abstract_attrs = true

[tool.bandit]
exclude_dirs = ["tests"]
tests = [
    "B101",  # assert_used
    "B106",  # hardcoded_password_funcarg
]

[tool.pytest]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
