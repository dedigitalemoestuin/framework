name: Security
on:
  push:
    branches:
      - main
env:
  SECRET_KEY: secret-key-used-for-workflows
jobs:
  backend:
    name: Backend
    runs-on: [self-hosted]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.9

      - name: Install dependencies
        run: uv sync --locked --group security

      - name: Run pip-audit
        run: uv run pip-audit

      - name: Run uv audit
        run: uv audit
