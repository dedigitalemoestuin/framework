name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  SECRET_KEY: secret-key-used-for-workflows
jobs:
  global:
    name: Global
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1

      - name: Install the project
        working-directory: ./backend
        run: uv sync --locked --dev

      - name: Run pre-commit
        run: uvx pre-commit run --all-files

  backend:
    name: Backend
    runs-on: [ubuntu-latest]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1

      - name: Install the project
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest

      - name: Run mypy
        run: uv run mypy .
