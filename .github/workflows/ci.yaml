name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  SECRET_KEY: secret-key-used-for-workflows
jobs:
  global:
    name: Global
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.22

      - name: Install the project
        working-directory: ./backend
        run: uv sync --locked --dev

      - name: Run pre-commit
        run: uvx pre-commit run --all-files

  backend:
    name: Backend
    runs-on: [ubuntu-latest]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.22

      - name: Install the project
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest

      - name: Run mypy
        run: uv run mypy .
